name: Build Grainlight IPA

on:
  push:
    branches: [main, grainlight-ios]
    paths:
      - 'Grainlight/**'
      - 'Grainlight.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'
      - 'qa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package unsigned IPA
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show installed Xcode
        run: xcodebuild -version

      - name: Independent QA checks
        run: |
          python3 qa/qa_camera.py
          python3 qa/qa_gallery.py
          python3 qa/qa_look.py

      - name: Execute production renderer on controlled images
        run: bash qa/run_native.sh

      - name: iOS device build (without signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Grainlight.xcodeproj \
            -scheme Grainlight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Grainlight.app"
          test -f "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/pack/Payload"
          ditto "$APP" "$RUNNER_TEMP/pack/Payload/Grainlight.app"
          (cd "$RUNNER_TEMP/pack" && zip -q -r "$GITHUB_WORKSPACE/Grainlight-unsigned.ipa" Payload)
          unzip -l Grainlight-unsigned.ipa | grep -E 'Payload/Grainlight.app/Grainlight$'

      - name: Save downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Grainlight-unsigned-IPA
          path: Grainlight-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Save controlled rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Grainlight-QA-evidence
          path: ${{ runner.temp }}/grainlight-qa
          retention-days: 30

      - name: Save Xcode build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
